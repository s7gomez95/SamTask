<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMTASK</title>
    <link rel="stylesheet" href="SamStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>
    <header>
        <h1 class="title">SAMTASK</h1>
        <h2 class="subtitle">Organizador De Tareas</h2>
    </header>
    <main>
        <div class="contenedor-tarjetas">
            <button class="tarjeta pendientes">
                <i class="fa-regular fa-clock icono"></i>
                <span class="titulo">Pendientes</span>
                <span class="numero">10</span>
                <span class="descripcion">Actividades por realizar</span>
            </button>
            <button class="tarjeta completadas">
                <i class="fa-solid fa-circle-check icono"></i>
                <span class="titulo">Completadas</span>
                <span class="numero">30</span>
                <span class="descripcion">Actividades Finalizadas</span>
            </button>
            <button class="tarjeta urgentes">
                <i class="fa-solid fa-triangle-exclamation icono"></i>
                <span class="titulo">Urgentes</span>
                <span class="numero">5</span>
                <span class="descripcion">Actividades que requieren atención</span>
            </button>
            <a class="tarjeta crear" href="crear-actividad.html">
                <i class="fa-solid fa-plus icono"></i>
                <span class="titulo">Crear Actividad</span>
                <span class="numero">?</span>   
            </a>

        </div>
    </main>
</body>
</html>
