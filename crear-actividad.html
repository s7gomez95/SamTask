<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Actividad</title>
    <link rel="stylesheet" href="crear-Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <header>
        <h1>CREAR ACTIVIDAD</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="crear-actividad.html">Crear actividad</a>
        </nav>
    </header>
    <main>
        <form>
            <section>
                <h2><i class="fa-solid fa-clipboard-list"></i>Datos De La Actividad</h2>
                <div class="campo formulario">
                    <label for="tipo">Tipo de Actividad</label>
                    <select name="tipo" id="tipo" required>
                        <option value="">Seleccionar una opción</option>
                        <option value="Instalación">Instalación</option>
                        <option value="Mantenimiento">Mantenimiento</option>
                        <option value="Retiro">Retiro</option>
                        <option value="Migración">Migración</option>
                    </select>
                    <label for="prioridad">Prioridad</label>
                    <select name="prioridad" id="prioridad" required>
                        <option value="">Seleccionar una opción</option>
                        <option value="normal">Normal</option>
                        <option value="urgente">Urgente</option>
                    </select>
                </div>
            </section>
            <section class="tarjeta-formulario cliente">
                <h2><i class="fa-solid fa-user"></i>Datos del cliente</h2>

                <label for="nombre">Nombre del cliente</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Perez" required>

                <label for="empresa">Empresa</label>
                <input type="text" id="empresa" name="empresa" placeholder=" Nombre de la empresa">

                <label for="contacto">Contacto</label>
                <input type="tel" id="contacto" name="contacto" minlength="7" maxlength="10" placeholder="N contacto" required>

                <label for="correo">Correo del cliente</label>
                <input type="email" id="correo" name="correo" required>

            </section>
            <h2><i class="fa-solid fa-car"></i>Datos del vehiculo</h2>

            <fieldset>
                <legend>Tipo de vehículo</legend>
                <input type="radio" id="carro" name="vehiculo" value="carro" required>
                <label for="carro">Carro</label>
                <input type="radio" id="moto" name="vehiculo" value="moto">
                <label for="moto">Moto</label>
                <input type="radio" id="tractocamion" name="vehiculo" value="tractocamion">
                <label for="tractocamion">Tractocamión</label>
            </fieldset>

            <fieldset>
                <legend>Accesorios</legend>
                <input type="checkbox" id="rele" name="accesorios" value="rele">
                <label for="rele">Requiere relé de corte</label>
                <input type="checkbox" id="ibutton" name="accesorios" value="ibutton">
                <label for="ibutton">Ibutton</label>
                <input type="checkbox" id="boton" name="accesorios" value="boton">
                <label for="boton">Botón de pánico</label>
                <input type="checkbox" id="caiquen" name="accesorios" value="caiquen">
                <label for="caiquen">Caiquen</label>
            </fieldset>

            <label for="patente">Patente</label>
            <input type="text" id="patente" name="patente" pattern="[A-Za-z]{3}[0-9]{3}|[A-Za-z]{3}[0-9]{2}[A-Za-z]"
                title="Carro: 3 letras y 3 numeros. (SSS123) Moto: 3 letras, 2 numeros y 1 letra (ABC12D)" minlength="6"
                maxlength="6" placeholder="Ej: SSS123" required>

            <label for="marca">Marca</label>
            <input type="text" id="marca" name="marca" placeholder="Ej: Nissan">

            <label for="modelo">Modelo</label>
            <input type="text" id="modelo" name="modelo" placeholder="Ej: Qashqai">

            <label for="anio">Año</label>
            <input type="number" id="anio" name="anio" placeholder="Ej: 2027" min="1990" max="2027" required>

            <label for="kilometraje">Kilometraje</label>
            <input type="number" id="kilometraje" name="kilometraje" min="0" placeholder="Ej: 165789" required>

            <label for="color">Color</label>
            <input type="text" id="color" name="color" placeholder="Ej: Blanco">

            <label for="vin">VIN</label>
            <input type="text" id="vin" name="vin" placeholder="VIN" minlength="17" maxlength="17" required>

            <h2><i class="fa-solid fa-calendar-day"></i>Programación</h2>

            <label for="ciudad">Ciudad</label>
            <input type="text" id="ciudad" name="ciudad" placeholder="Ej: Bogotá">

            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" name="direccion" placeholder="Dirección de la actividad">

            <label for="fecha">Fecha de la Actividad</label>
            <input type="date" id="fecha" name="fecha">

            <label for="hora">Hora de la Visita</label>
            <input type="time" id="hora" name="hora">

            <label for="descripcion">Descripción de la actividad</label>
            <textarea name="descripcion" id="descripcion" rows="4"></textarea>

            <button type="submit">Crear actividad</button>
        </form>
        <footer>
            <p>SAMTASK 2027</p>
        </footer>
    </main>
</body>

</html>
